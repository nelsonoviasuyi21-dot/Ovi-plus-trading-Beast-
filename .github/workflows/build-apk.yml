name: Build Ovi Plus Trading Beast APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Rename APK
        run: |
          mkdir -p output
          APK=$(find . -type f -path "*/build/outputs/apk/debug/*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK was not produced"
            exit 1
          fi
          cp "$APK" output/Ovi-Plus-Trading-Beast-ADVANCED.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ovi-Plus-Trading-Beast-ADVANCED
          path: output/Ovi-Plus-Trading-Beast-ADVANCED.apk
