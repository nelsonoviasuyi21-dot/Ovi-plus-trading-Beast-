name: Build Ovi Plus Trading Beast APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:

  build:

    name: Build Android APK

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build debug APK
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk \
             release/Ovi-Plus-Trading-Beast-ADVANCED.apk

      - name: Verify APK
        run: |
          ls -lh release/Ovi-Plus-Trading-Beast-ADVANCED.apk
          file release/Ovi-Plus-Trading-Beast-ADVANCED.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ovi-Plus-Trading-Beast-ADVANCED
          path: release/Ovi-Plus-Trading-Beast-ADVANCED.apk
          retention-days: 30
